services:
  termimus-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/termimus/termimus-sync:latest
    container_name: termimus-sync
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - termimus_sync_data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - DB_PATH=/data/sync.db
      - TERMIMUS_AUTH_TOKEN=change-this-to-a-secure-random-token
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  termimus_sync_data:
    driver: local
